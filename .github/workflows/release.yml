name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      # Checkout
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      # Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0

      # Install
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build
      - name: Build packages
        run: pnpm -r build

      # Publish
      - name: Publish packages
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          case "${VERSION}" in
            *-beta.*)
              NPM_TAG="beta"
              ;;
            *-rc.*)
              NPM_TAG="rc"
              ;;
            *)
              NPM_TAG="latest"
              ;;
          esac

          for PACKAGE_DIR in packages/sdk packages/create-sdk; do
            PACKAGE=$(node -p "require('./${PACKAGE_DIR}/package.json').name")

            if npm view "${PACKAGE}@${VERSION}" version \
              --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then

              echo "${PACKAGE}@${VERSION} already exists, skip."

            else

              echo "Publishing ${PACKAGE}@${VERSION}"

              npm publish \
                --workspace="${PACKAGE_DIR}" \
                --access public \
                --tag "${NPM_TAG}"

            fi
          done

      # Package release artifacts
      - name: Package release artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          tar -czf "sdk-${VERSION}.tgz" \
            -C packages/sdk dist

          tar -czf "create-sdk-${VERSION}.tgz" \
            -C packages/create-sdk dist

      # GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          token: ${{ github.token }}
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            sdk-${{ github.ref_name }}.tgz
            create-sdk-${{ github.ref_name }}.tgz
