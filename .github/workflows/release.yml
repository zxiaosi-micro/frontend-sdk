name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # Checkout
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      # Node
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # Install
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build
      - name: Build
        run: pnpm build

      # Create Release Notes Based on GitHub PRs / Commits
      - name: Generate GitHub Release
        run: pnpx changelogithub
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish
      - name: Publish to NPM
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          case "${VERSION}" in
            *-beta.*)
              NPM_TAG="beta"
              ;;
            *-rc.*)
              NPM_TAG="rc"
              ;;
            *)
              NPM_TAG="latest"
              ;;
          esac

          for PACKAGE_DIR in packages/sdk packages/create-sdk; do
            PACKAGE=$(node -p "require('./${PACKAGE_DIR}/package.json').name")

            echo "Publishing ${PACKAGE}@${VERSION} with tag ${NPM_TAG}"

            pnpm --dir "${PACKAGE_DIR}" publish \
              --no-git-checks \
              --tag "${NPM_TAG}"
          done
